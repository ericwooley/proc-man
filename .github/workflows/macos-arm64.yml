name: macOS ARM64

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-and-service:
    name: Homebrew startup and LaunchAgent
    runs-on: macos-26
    timeout-minutes: 15
    env:
      GOARCH: arm64
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the release binary
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
        run: |
          mkdir -p "$RUNNER_TEMP/proc-man-build"
          go build -ldflags "-s -w -X main.version=ci" \
            -o "$RUNNER_TEMP/proc-man-build/proc-man" ./cmd/proc-man
          tar -czf "$RUNNER_TEMP/proc-man-ci.tar.gz" \
            -C "$RUNNER_TEMP/proc-man-build" proc-man

      - name: Install the Homebrew Formula
        run: |
          brew tap-new proc-man/ci
          tap_path="$(brew --repository proc-man/ci)"
          mkdir -p "$tap_path/Formula"
          archive_sha="$(shasum -a 256 "$RUNNER_TEMP/proc-man-ci.tar.gz" | awk '{print $1}')"
          sed "s/PROC_MAN_CI_SHA256/$archive_sha/" \
            .github/test-formulae/proc-man-ci.rb \
            > "$tap_path/Formula/proc-man-ci.rb"
          install -m 0644 "$RUNNER_TEMP/proc-man-ci.tar.gz" \
            "$tap_path/proc-man-ci.tar.gz"
          brew install proc-man/ci/proc-man-ci

      - name: Check CLI startup and daemon installation
        run: |
          proc-man --help > "$RUNNER_TEMP/proc-man-help.txt"
          grep -q "Manage local development processes and logs" \
            "$RUNNER_TEMP/proc-man-help.txt"
          if launchctl print "gui/$(id -u)/dev.proc-man" > /dev/null 2>&1; then
            printf 'Formula installation started the daemon unexpectedly.\n' >&2
            exit 1
          fi
          proc-man daemon install --now
          daemon_target="gui/$(id -u)/dev.proc-man"
          daemon_pid_before="$(launchctl print "$daemon_target" | awk '/pid =/ { print $3; exit }')"
          test -n "$daemon_pid_before"
          brew postinstall proc-man/ci/proc-man-ci
          daemon_pid_after="$(launchctl print "$daemon_target" | awk '/pid =/ { print $3; exit }')"
          test -n "$daemon_pid_after"
          test "$daemon_pid_before" != "$daemon_pid_after"
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:13337/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Remove the test Formula
        if: always()
        run: |
          proc-man daemon uninstall || true
          brew uninstall proc-man/ci/proc-man-ci || true
          brew untap proc-man/ci || true
