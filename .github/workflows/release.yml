name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and publish
    environment: release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Build the React application
        run: npm run build:web

      - name: Test the Go application
        run: go test ./...

      - name: Create the semantic version and GitHub Release
        id: version
        if: github.event_name == 'push'
        run: |
          npx --yes --package semantic-release@25.0.9 semantic-release
          git fetch --force --tags origin
          release_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the release tag
        id: release-tag
        env:
          CREATED_TAG: ${{ steps.version.outputs.tag }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          release_tag="$CREATED_TAG"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="$REQUESTED_TAG"
          fi
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Publish release archives
        if: steps.release-tag.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the Homebrew Formula
        if: steps.release-tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
          TAP_OWNER: ${{ github.repository_owner }}
        run: |
          formula_path="$RUNNER_TEMP/proc-man.rb"
          formula_api="repos/$TAP_OWNER/homebrew-apps/contents/Formula/proc-man.rb"
          version="${RELEASE_TAG#v}"

          node scripts/render-homebrew-formula.mjs \
            "$version" \
            release-dist/checksums.txt \
            .github/homebrew/proc-man.rb.tmpl \
            "$formula_path"

          formula_content="$(base64 < "$formula_path" | tr -d '\n')"
          formula_sha="$(gh api "$formula_api" --jq '.sha // empty' 2>/dev/null || true)"
          formula_args=(
            -f "message=chore: update proc-man Formula to $RELEASE_TAG"
            -f "content=$formula_content"
          )
          if [[ -n "$formula_sha" ]]; then
            formula_args+=(-f "sha=$formula_sha")
          fi
          gh api --method PUT "$formula_api" "${formula_args[@]}"

  macos-arm64-formula:
    name: Verify the published macOS ARM64 Formula
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: macos-26
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Install and verify the published Formula
        run: |
          run_bounded() {
            limit="$1"
            shift
            "$@" &
            command_pid=$!
            (
              sleep "$limit"
              kill -TERM "$command_pid" 2>/dev/null || exit 0
              sleep 2
              kill -KILL "$command_pid" 2>/dev/null || true
            ) &
            watchdog_pid=$!
            set +e
            wait "$command_pid"
            status=$?
            set -e
            kill "$watchdog_pid" 2>/dev/null || true
            wait "$watchdog_pid" 2>/dev/null || true
            return "$status"
          }

          brew update
          run_bounded 180 brew install ericwooley/apps/proc-man
          run_bounded 20 proc-man --help > "$RUNNER_TEMP/proc-man-help.txt"
          grep -q "Manage local development processes and logs" \
            "$RUNNER_TEMP/proc-man-help.txt"
          expected_version="${RELEASE_TAG#v}"
          proc-man --version | grep -F "proc-man version $expected_version"
          run_bounded 60 proc-man daemon install --now
          launchctl print "gui/$(id -u)/dev.proc-man"
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:13337/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Remove the published Formula
        if: always()
        run: |
          proc-man daemon uninstall || true
          brew uninstall ericwooley/apps/proc-man || true
